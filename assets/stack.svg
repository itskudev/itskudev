      .i { font-size: 13px; fill: #E6F1FF; }
      .b { font-size: 13px; fill: #00D9FF; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="249" rx="12" fill="#000000" stroke="#0F2A2E"/>
  <rect x="40" y="26" width="8" height="8" fill="#00F5D4"/>
  <text x="58" y="35" class="mono" font-size="11" letter-spacing="3" fill="#8892A6">TECHNICAL STACK</text>
