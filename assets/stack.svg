<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Technical stack">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
